services:
  meetings-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_PATH: "/meetings"
        NEXT_PUBLIC_BASE_PATH: "/meetings"
    container_name: vivonline-meetings
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Subpath hosting variables
      - BASE_PATH=/meetings
      - NEXT_PUBLIC_BASE_PATH=/meetings
      # GigaSTT transcription service (local or remote)
      - FASTAPI_API_URL=${FASTAPI_API_URL:-http://127.0.0.1:9876}
      # OpenAI API key and model for normalization and protocols
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5.6-luna}
      # Persistent data folder
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
